name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build wheels
        run: |
          maturin build --release

      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build sdist
        run: |
          maturin build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v3
        with:
          name: sdist
          path: target/wheels/

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/pyblastradius/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist/

      - name: Flatten dist directory
        run: |
          mkdir -p final_dist
          find dist -type f -name "*.whl" -o -name "*.tar.gz" | while read file; do
            cp "$file" final_dist/
          done
          ls -la final_dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: final_dist/

  publish-github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
          body: |
            # PyBlastRadius ${{ github.ref_name }}

            Operational Blast Radius Intelligence Platform

            ## Installation

            ```bash
            pip install pyblastradius==${{ github.ref_name }}
            ```

            ## What's New

            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.

            ## Documentation

            - [Quick Start](https://github.com/Mullassery/PyBlastRadius/blob/main/docs/QUICK_START.md)
            - [Architecture](https://github.com/Mullassery/PyBlastRadius/blob/main/docs/ARCHITECTURE.md)
            - [Contributing](https://github.com/Mullassery/PyBlastRadius/blob/main/CONTRIBUTING.md)

            ## Support

            - GitHub Issues: https://github.com/Mullassery/PyBlastRadius/issues
            - Email: mullassery@gmail.com
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
