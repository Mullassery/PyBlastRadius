[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyblastradius"
version = "0.4.4"
description = "Operational Blast Radius Intelligence Platform - Predict cascading failures and quantify business impact"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
keywords = [
    "observability",
    "incident-response",
    "dependency-graph",
    "blast-radius",
    "sre",
    "reliability",
    "cascade-prediction",
    "data-quality"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "click>=8.0",
]

[project.scripts]
pyblastradius = "pyblastradius.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
    # Required transitively by starlette.testclient.TestClient, which
    # tests/test_server.py uses via fastapi.testclient -- without this,
    # `pip install -e .[dev]` followed by `pytest` fails 4 tests in
    # tests/test_server.py with "requires the httpx2 package" (verified
    # 2026-09-19).
    "httpx>=0.24",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
cli = [
    "click>=8.0",
    "rich>=12.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
all = [
    "click>=8.0",
    "rich>=12.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Mullassery/PyBlastRadius"
Documentation = "https://github.com/Mullassery/PyBlastRadius#readme"
Issues = "https://github.com/Mullassery/PyBlastRadius/issues"
Homepage = "https://github.com/Mullassery/PyBlastRadius"

[tool.maturin]
python-source = "python"
module-name = "pyblastradius._core"
# Without this, `maturin sdist` omits LICENSE from the source distribution,
# and PyPI rejects the upload (recurring issue across this org's Rust/PyO3
# repos -- see e.g. the maturin sdist LICENSE bug in other Mullassery repos).
include = ["LICENSE"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=pyblastradius --cov-report=term-missing --cov-report=html"

# Lint gate (PYBLASTRADIUS-003): curated, high-signal ruleset (not `ALL`,
# which is dominated by stylistic/docstring rules). E501 is left to the
# formatter. `target-version` matches `requires-python = ">=3.10"`.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PIE", "PERF", "FURB"]
ignore = [
    "E501", # line length is the formatter's job, not the linter's
]
