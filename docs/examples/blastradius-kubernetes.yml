version: 1

# Kubernetes-only configuration
discovery:
  sources:
    - type: kubernetes
      kubeconfig: ~/.kube/config
      context: production
      namespaces:
        - default
        - production
        - payment
      required: true

analysis:
  max-depth: 5
  include-transitive: true

outputs:
  - type: json
    path: blast-radius.json
  - type: html
    path: blast-radius.html

alerts:
  - condition: "blast_radius_score > 0.8"
    actions:
      - type: slack
        webhook-url: ${SLACK_WEBHOOK}
        channel: "#incidents"
