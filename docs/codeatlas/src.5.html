<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 111 symbols across 3 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "analysis", "label": "analysis", "description": "Owns 61 symbols across 6 file(s)."}}, {"data": {"id": "api", "label": "api", "description": "Owns 26 symbols across 3 file(s)."}}, {"data": {"id": "discovery", "label": "discovery", "description": "Owns 144 symbols across 5 file(s)."}}, {"data": {"id": "graph", "label": "graph", "description": "Owns 118 symbols across 6 file(s)."}}, {"data": {"id": "integrations", "label": "integrations", "description": "Owns 92 symbols across 5 file(s)."}}, {"data": {"id": "models", "label": "models", "description": "Owns 10 symbols across 1 file(s)."}}, {"data": {"id": "utils", "label": "utils", "description": "Owns 7 symbols across 1 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "src", "target": "analysis", "label": "calls"}}, {"data": {"id": "edge_1", "source": "src", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_2", "source": "src", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_3", "source": "analysis", "target": "src", "label": "calls"}}, {"data": {"id": "edge_4", "source": "analysis", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_5", "source": "analysis", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_6", "source": "discovery", "target": "src", "label": "calls"}}, {"data": {"id": "edge_7", "source": "discovery", "target": "graph", "label": "calls"}}, {"data": {"id": "edge_8", "source": "graph", "target": "src", "label": "calls"}}, {"data": {"id": "edge_9", "source": "graph", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_10", "source": "integrations", "target": "discovery", "label": "calls"}}, {"data": {"id": "edge_11", "source": "integrations", "target": "graph", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
